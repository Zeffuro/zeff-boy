id: com.github.zeffuro.zeff-boy
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zeff-boy
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --filesystem=xdg-run/pipewire-0:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/zeff-boy/cargo-home
modules:
  - name: zeff-boy
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo
      - cp packaging/flatpak/cargo-config.toml .cargo/config.toml
      - HOST_TARGET="$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"; LLVM_PROFDATA="$(rustc --print sysroot)/lib/rustlib/${HOST_TARGET}/bin/llvm-profdata"; test -x "$LLVM_PROFDATA"; "$LLVM_PROFDATA" --version
      - |
        TASK_PGO_ROOT="$(mktemp -d /tmp/zeff-pgo.XXXXXX)"
        python3 scripts/build-optimized.py \
          --artifact desktop \
          --output-dir "$TASK_PGO_ROOT/run" \
          --target-dir target \
          --offline \
          --no-default-features \
          --features audio-recording
        test -f "$TASK_PGO_ROOT/run/manifest.json"
        python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "complete"' \
          "$TASK_PGO_ROOT/run/manifest.json"
        install -Dm755 "$TASK_PGO_ROOT/run/artifacts/optimized-zeff-boy" \
          /app/bin/zeff-boy
      - install -Dm644 packaging/flatpak/com.github.zeffuro.zeff-boy.desktop /app/share/applications/com.github.zeffuro.zeff-boy.desktop
      - install -Dm644 packaging/flatpak/com.github.zeffuro.zeff-boy.metainfo.xml /app/share/metainfo/com.github.zeffuro.zeff-boy.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/com.github.zeffuro.zeff-boy.png
      - install -Dm644 LICENSE-MIT /app/share/licenses/zeff-boy/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/zeff-boy/LICENSE-APACHE
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/licenses/zeff-boy/THIRD_PARTY_NOTICES.md
    sources:
      - type: dir
        path: ../..
