[package]
name = "zeff-romtest"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "Manifest-driven emulator accuracy test runner for Zeff Boy."
repository = "https://github.com/zeffuro/zeff-boy"

[dependencies]
anyhow = "1.0.104"
zeff-emu-common = { path = "../zeff-emu-common", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.3"
ureq = "3.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
