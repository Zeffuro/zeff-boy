[package]
name = "zeff-gb-core"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "Game Boy and Game Boy Color emulation core library."
repository = "https://github.com/zeffuro/zeff-boy"

[dependencies]
zeff-emu-common = { path = "../zeff-emu-common" }
anyhow = "1.0.104"
bitflags = "2.13.1"
log = "0.4.33"
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
arrayvec = "0.7.8"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11"
zeff-test-support = { path = "../zeff-test-support" }

[[bench]]
name = "gb_benchmarks"
harness = false
