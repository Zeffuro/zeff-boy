[package]
name = "zeff-pgo-corpus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
zeff-gba-core = { path = "../zeff-gba-core" }
zeff-gb-core = { path = "../zeff-gb-core" }
zeff-nes-core = { path = "../zeff-nes-core" }
zeff-pce-core = { path = "../zeff-pce-core" }
zeff-sega8-core = { path = "../zeff-sega8-core" }
zeff-ws-core = { path = "../zeff-ws-core" }

[[bin]]
name = "zeff-pgo-corpus"
path = "src/main.rs"
