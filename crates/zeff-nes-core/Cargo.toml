[package]
name = "zeff-nes-core"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "NES (Nintendo Entertainment System) emulation core library."
repository = "https://github.com/zeffuro/zeff-boy"

[dependencies]
zeff-emu-common = { path = "../zeff-emu-common" }
anyhow = "1.0.104"
bitflags = "2.13.1"
crc32fast = "1.5.0"
log = "0.4.33"
lz4_flex = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11"

[[bench]]
name = "nes_benchmarks"
harness = false
