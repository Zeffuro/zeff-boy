[package]
name = "zeff-libretro"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "Libretro core for zeff-boy (GB/GBC/GBA/NES/WonderSwan/Sega 8-bit emulator)"

[lib]
crate-type = ["cdylib"]

[dependencies]
zeff-emu-common = { path = "../zeff-emu-common" }
zeff-gb-core = { path = "../zeff-gb-core" }
zeff-gba-core = { path = "../zeff-gba-core" }
zeff-nes-core = { path = "../zeff-nes-core" }
zeff-sega8-core = { path = "../zeff-sega8-core" }
zeff-ws-core = { path = "../zeff-ws-core" }
anyhow = "1.0.104"
log = "0.4.33"
env_logger = "0.11.11"
