[package]
name = "zeff-ws-core"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "WonderSwan emulation core library."
repository = "https://github.com/zeffuro/zeff-boy"

[features]
profiling = []

[dependencies]
zeff-emu-common = { path = "../zeff-emu-common" }
anyhow = "1.0.104"
crc32fast = "1.5.0"
sha2 = "0.11.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "ws_benchmarks"
harness = false
