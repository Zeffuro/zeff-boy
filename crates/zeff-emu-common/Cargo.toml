[package]
name = "zeff-emu-common"
version = "0.1.0"
edition = "2024"
authors = ["Zeffuro"]
license = "MIT OR Apache-2.0"
description = "Shared debug, cheat, save-state, rewind, and replay types for zeff-boy emulator cores."
repository = "https://github.com/zeffuro/zeff-boy"

[dependencies]
anyhow = "1.0.104"
log = "0.4.33"
lz4_flex = "0.14.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
