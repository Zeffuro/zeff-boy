[package]
name = "zeff-netplay-lobby"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded signaling-only netplay lobby. Does not relay gameplay."

[dependencies]
zeff-netplay-protocol = { path = "../zeff-netplay-protocol" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.50", features = ["rt", "macros", "net", "time", "sync", "signal"] }
serde_json = "1.0.151"
getrandom = "0.4.3"
anyhow = "1.0.104"
sha2 = "0.11.0"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"
