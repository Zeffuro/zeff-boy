name: Optimized build qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.artifact }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {artifact: desktop, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
          - {artifact: desktop, target: x86_64-pc-windows-msvc, os: windows-latest}
          - {artifact: desktop, target: aarch64-apple-darwin, os: macos-latest}
          - {artifact: libretro, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
          - {artifact: libretro, target: x86_64-pc-windows-msvc, os: windows-latest}
          - {artifact: libretro, target: aarch64-apple-darwin, os: macos-latest}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-optimized-${{ matrix.artifact }}-${{ matrix.target }}"
      - name: Build and qualify
        run: python scripts/build-optimized.py --artifact "${{ matrix.artifact }}" --expected-target "${{ matrix.target }}" --output-dir "${{ runner.temp }}/zeff-pgo" --target-dir target
      - name: Upload held artifact and compact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optimized-${{ matrix.artifact }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/zeff-pgo/artifacts/optimized-*
            ${{ runner.temp }}/zeff-pgo/manifest.json
            ${{ runner.temp }}/zeff-pgo/logs/
