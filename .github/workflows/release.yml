name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: zeff-boy
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: zeff-boy.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: zeff-boy

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-release-${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../packaging/zeff-boy.desktop .
          cp ../../../LICENSE-MIT .
          cp ../../../LICENSE-APACHE .
          cp ../../../THIRD_PARTY_NOTICES.md .
          cp ../../../assets/icon.png zeff-boy.png
          tar czf ../../../zeff-boy-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            ${{ matrix.artifact }} zeff-boy.desktop LICENSE-MIT LICENSE-APACHE \
            THIRD_PARTY_NOTICES.md zeff-boy.png

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            "${{ github.ref_name }}" \
            "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
            .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../LICENSE-MIT .
          cp ../../../LICENSE-APACHE .
          cp ../../../THIRD_PARTY_NOTICES.md .
          7z a ../../../zeff-boy-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.artifact }} LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeff-boy-${{ matrix.target }}
          path: zeff-boy-${{ github.ref_name }}-${{ matrix.target }}.*

  libretro:
    name: Libretro Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libzeff_libretro.so
            archive_name: zeff_libretro-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            lib: zeff_libretro.dll
            archive_name: zeff_libretro-windows-x86_64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libzeff_libretro.dylib
            archive_name: zeff_libretro-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - name: Sync .info display_version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' "s/^display_version = .*/display_version = \"${VERSION}\"/" crates/zeff-libretro/zeff_libretro.info
          else
            sed -i "s/^display_version = .*/display_version = \"${VERSION}\"/" crates/zeff-libretro/zeff_libretro.info
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-libretro-${{ matrix.target }}"

      - name: Build libretro core
        run: cargo build --release --target ${{ matrix.target }} -p zeff-libretro

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../crates/zeff-libretro/zeff_libretro.info .
          tar czf ../../../${{ matrix.archive_name }} ${{ matrix.lib }} zeff_libretro.info

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../crates/zeff-libretro/zeff_libretro.info .
          7z a ../../../${{ matrix.archive_name }} ${{ matrix.lib }} zeff_libretro.info

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libretro-${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  appimage:
    name: AppImage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: zeff-boy-x86_64-unknown-linux-gnu
          path: linux-artifact

      - name: Extract binary
        run: |
          cd linux-artifact
          tar xzf zeff-boy-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libudev1 libfuse2

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/metainfo
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/doc/zeff-boy

          cp linux-artifact/zeff-boy AppDir/usr/bin/zeff-boy
          chmod +x AppDir/usr/bin/zeff-boy

          cp packaging/zeff-boy.desktop AppDir/usr/share/applications/zeff-boy.desktop
          cp packaging/com.github.zeffuro.zeff-boy.metainfo.xml AppDir/usr/share/metainfo/
          cp packaging/com.github.zeffuro.zeff-boy.metainfo.xml AppDir/usr/share/metainfo/com.github.zeffuro.zeff-boy.appdata.xml

          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zeff-boy.png
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/zeff-boy/

          cp AppDir/usr/share/applications/zeff-boy.desktop AppDir/zeff-boy.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/zeff-boy.png AppDir/zeff-boy.png

      - name: Download linuxdeploy and AppImage runtime
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Pre-download the type-2 runtime with retries (avoids transient 504s from GitHub CDN)
          for i in 1 2 3 4 5; do
            if wget -q -O runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64; then
              echo "Runtime downloaded on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          if [ ! -f runtime-x86_64 ]; then
            echo "::error::Failed to download AppImage runtime after 5 attempts"
            exit 1
          fi

      - name: Build AppImage
        run: |
          TAG="${{ github.ref_name }}"
          export LINUXDEPLOY_OUTPUT_VERSION="${TAG}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

          # Ensure the expected filename exists
          EXPECTED="zeff-boy-${TAG}-x86_64.AppImage"
          if [ ! -f "$EXPECTED" ]; then
            mv zeff-boy-*x86_64.AppImage "$EXPECTED"
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeff-boy-appimage
          path: zeff-boy-${{ github.ref_name }}-x86_64.AppImage

  linux-packages:
    name: Linux packages
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: zeff-boy-x86_64-unknown-linux-gnu
          path: linux-artifact

      - name: Extract binary
        run: |
          cd linux-artifact
          tar xzf zeff-boy-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils lintian rpm

      - name: Check Linux compatibility floor
        run: |
          MAX_GLIBC=$(objdump -T linux-artifact/zeff-boy \
            | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -Vu | tail -n1)
          echo "Maximum required GLIBC version: ${MAX_GLIBC}"
          dpkg --compare-versions "${MAX_GLIBC}" le "2.35"

      - name: Build and inspect packages
        run: |
          bash scripts/package-linux.sh \
            "${{ github.ref_name }}" linux-artifact/zeff-boy linux-packages
          desktop-file-validate packaging/zeff-boy.desktop
          appstreamcli validate --no-net packaging/com.github.zeffuro.zeff-boy.metainfo.xml
          lintian --pedantic --fail-on error linux-packages/*.deb

      - name: Test package installation
        run: |
          docker run --rm -v "$PWD/linux-packages:/packages:ro" ubuntu:22.04 \
            bash -c 'apt-get update && apt-get install -y /packages/*.deb xvfb mesa-vulkan-drivers && ! ldd /usr/bin/zeff-boy | grep -q "not found" && timeout 10s xvfb-run -a env ZEFF_MUTE_AUDIO=1 /usr/bin/zeff-boy >/tmp/zeff-boy.log 2>&1; test $? -eq 124'
          docker run --rm -v "$PWD/linux-packages:/packages:ro" ubuntu:24.04 \
            bash -c 'apt-get update && apt-get install -y /packages/*.deb && ! ldd /usr/bin/zeff-boy | grep -q "not found"'
          docker run --rm -v "$PWD/linux-packages:/packages:ro" fedora:43 \
            bash -c 'dnf install -y /packages/*.rpm && ! ldd /usr/bin/zeff-boy | grep -q "not found"'

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: zeff-boy-linux-packages
          path: linux-packages/*

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg zstd
          flatpak --version
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Restore previous custom repository
        id: previous-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-flatpak
          while read -r TAG; do
            rm -f previous-flatpak/zeff-boy-flatpak-repo.tar.zst
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern zeff-boy-flatpak-repo.tar.zst \
              --dir previous-flatpak; then
              echo "Restoring Flatpak repository from ${TAG}"
              break
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName')
          ARCHIVE=$(find previous-flatpak -type f -name '*.tar.zst' -print -quit)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak artifacts
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          bash scripts/package-flatpak.sh \
            "${{ github.ref_name }}" flatpak-output \
            "${{ steps.previous-repo.outputs.archive }}"

      - name: Inspect Flatpak bundle
        run: |
          mkdir -p flatpak-test-site/flatpak
          tar --zstd -xf flatpak-output/zeff-boy-flatpak-repo.tar.zst \
            -C flatpak-test-site/flatpak
          sed 's#^Url=.*#Url=http://127.0.0.1:18080/flatpak/repo/#' \
            flatpak-output/com.github.zeffuro.zeff-boy.flatpakref \
            > flatpak-output/test.flatpakref
          python3 -m http.server 18080 --directory flatpak-test-site &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          flatpak install --user --noninteractive -y flatpak-output/test.flatpakref
          flatpak info --user com.github.zeffuro.zeff-boy
          flatpak info --user --show-permissions com.github.zeffuro.zeff-boy
          flatpak run --user --command=sh com.github.zeffuro.zeff-boy \
            -c 'test -x /app/bin/zeff-boy'

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zeff-boy-flatpak
          path: flatpak-output/*

  publish-pages:
    name: Publish Flatpak repository
    needs: [flatpak, release]
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      flatpak_artifact: zeff-boy-flatpak

  release:
    name: Create draft release
    needs: [build, libretro, appimage, linux-packages, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          CHECKSUMS="$(mktemp)"
          find artifacts -maxdepth 1 -type f -printf '%f\0' \
            | sort -z \
            | (cd artifacts && xargs -0 sha256sum) > "$CHECKSUMS"
          mv "$CHECKSUMS" artifacts/SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*

  publish-release:
    name: Publish release
    needs: publish-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-snap:
    name: Publish Snap
    needs: publish-release
    uses: ./.github/workflows/snap.yml
    with:
      release_tag: ${{ github.ref_name }}

  update-scoop:
    name: Update Scoop manifest
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Zeffuro/scoop-zeff-boy
          token: ${{ secrets.PACKAGE_REPO_TOKEN }}

      - name: Update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/Zeffuro/zeff-boy/releases/download/v${VERSION}/zeff-boy-v${VERSION}-x86_64-pc-windows-msvc.zip"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          jq -n \
            --arg ver "$VERSION" \
            --arg url "$URL" \
            --arg hash "$SHA256" \
            '{
              version: $ver,
              description: "A Game Boy, Game Boy Color, and NES emulator written in Rust",
              homepage: "https://github.com/Zeffuro/zeff-boy",
              license: { identifier: "MIT|Apache-2.0", url: "https://github.com/Zeffuro/zeff-boy/blob/master/LICENSE-MIT" },
              architecture: { "64bit": { url: $url, hash: $hash } },
              bin: "zeff-boy.exe",
              checkver: { github: "https://github.com/Zeffuro/zeff-boy" },
              autoupdate: { architecture: { "64bit": { url: "https://github.com/Zeffuro/zeff-boy/releases/download/v$version/zeff-boy-v$version-x86_64-pc-windows-msvc.zip" } } }
            }' > bucket/zeff-boy.json

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/zeff-boy.json
          git diff --cached --quiet || git commit -m "Update zeff-boy to ${GITHUB_REF_NAME}"
          git push

  update-winget:
    name: Submit WinGet update
    needs: publish-release
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: winget-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Submit updated manifest
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: ./scripts/submit-winget.ps1 -Version "${{ github.ref_name }}"

  update-homebrew:
    name: Update Homebrew cask
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Zeffuro/homebrew-zeff-boy
          token: ${{ secrets.PACKAGE_REPO_TOKEN }}

      - name: Update cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/Zeffuro/zeff-boy/releases/download/v${VERSION}/zeff-boy-v${VERSION}-aarch64-apple-darwin.dmg"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          python3 -c "
          v, s = '${VERSION}', '${SHA256}'
          print(f'''cask \"zeff-boy\" do
            version \"{v}\"
            sha256 \"{s}\"

            url \"https://github.com/Zeffuro/zeff-boy/releases/download/v#{{version}}/zeff-boy-v#{{version}}-aarch64-apple-darwin.dmg\"
            name \"zeff-boy\"
            desc \"A Game Boy, Game Boy Color, and NES emulator written in Rust\"
            homepage \"https://github.com/Zeffuro/zeff-boy\"

            depends_on arch: :arm64

            app \"Zeff Boy.app\"

            livecheck do
              url :url
              strategy :github_latest
            end
          end''')
          " > Casks/zeff-boy.rb

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/zeff-boy.rb
          git diff --cached --quiet || git commit -m "Update zeff-boy to ${GITHUB_REF_NAME}"
          git push

  update-aur:
    name: Update AUR
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate PKGBUILD and .SRCINFO
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/Zeffuro/zeff-boy/releases/download/v${VERSION}/zeff-boy-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          mkdir -p aur-work
          python3 scripts/generate-aur.py "$VERSION" "$SHA256" aur-work

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

          git clone ssh://aur@aur.archlinux.org/zeff-boy-bin.git aur-repo
          cp aur-work/PKGBUILD aur-repo/PKGBUILD
          cp aur-work/.SRCINFO aur-repo/.SRCINFO

          cd aur-repo
          git config user.name "Zeffuro"
          git config user.email "Jeffroiscool@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to v${GITHUB_REF_NAME#v}"
          git push

