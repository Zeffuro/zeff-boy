name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      flatpak_artifact:
        description: Signed Flatpak repository artifact from the calling workflow
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      flatpak_summary_sha256: ${{ steps.flatpak.outputs.summary_sha256 }}
      flatpak_ref_sha256: ${{ steps.flatpak.outputs.ref_sha256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-pages

      - name: Build
        run: trunk build --release --public-url /zeff-boy/

      - name: Download current Flatpak repository
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.flatpak_artifact }}
          path: flatpak-release

      - name: Add custom Flatpak repository
        id: flatpak
        run: |
          ARCHIVE=$(find flatpak-release -type f \
            -name 'zeff-boy-flatpak-repo.tar.zst' -print -quit 2>/dev/null || true)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::The release did not produce a signed Flatpak repository"
            exit 1
          fi
          mkdir -p dist/flatpak
          tar --zstd -xf "$ARCHIVE" -C dist/flatpak
          test -s dist/flatpak/repo/summary
          test -s dist/flatpak/com.github.zeffuro.zeff-boy.flatpakref
          echo "summary_sha256=$(sha256sum dist/flatpak/repo/summary | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ref_sha256=$(sha256sum dist/flatpak/com.github.zeffuro.zeff-boy.flatpakref | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify hosted Flatpak repository
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SUMMARY_SHA256: ${{ needs.build.outputs.flatpak_summary_sha256 }}
          REF_SHA256: ${{ needs.build.outputs.flatpak_ref_sha256 }}
        run: |
          verify_hosted_file() {
            local path="$1" expected="$2" downloaded="$RUNNER_TEMP/flatpak-hosted-file"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || return 1
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 30 \
                "${PAGE_URL}flatpak/${path}?release=${GITHUB_SHA}&attempt=${attempt}" \
                --output "$downloaded" \
                && printf '%s  %s\n' "$expected" "$downloaded" | sha256sum --check; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Hosted Flatpak file does not match this release: ${path}"
            return 1
          }
          verify_hosted_file repo/summary "$SUMMARY_SHA256"
          verify_hosted_file com.github.zeffuro.zeff-boy.flatpakref "$REF_SHA256"
