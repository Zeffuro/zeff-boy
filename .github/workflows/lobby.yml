name: Netplay lobby

on:
  pull_request:
    paths: ["crates/zeff-netplay-protocol/**", "crates/zeff-netplay-lobby/**", "crates/zeff-netplay-connect/**", "Dockerfile.lobby*", "infra/lobby/**", ".github/workflows/lobby.yml", "Cargo.toml", "Cargo.lock"]
  push:
    tags: ["lobby-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobby-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p zeff-netplay-protocol -p zeff-netplay-lobby
      - run: cargo test --locked -p zeff-netplay-connect --features native --all-targets
      - run: cargo clippy --locked -p zeff-netplay-protocol -p zeff-netplay-lobby -p zeff-netplay-connect --all-targets --all-features -- -D warnings
      - run: cargo fmt -p zeff-netplay-protocol -p zeff-netplay-lobby -p zeff-netplay-connect -- --check
      - run: cargo check --locked -p zeff-netplay-protocol -p zeff-netplay-connect --target wasm32-unknown-unknown

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check independent release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/zeff-netplay-lobby/Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "lobby-v$VERSION"
      - name: Require Docker Hub credentials for publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lobby-v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before publishing a lobby release."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: docker.io/zeffuro/zeff-boy-lobby
          flavor: latest=false
          tags: |
            type=match,pattern=lobby-v(.*),group=1
            type=sha
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lobby
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            zeff-boy-lobby:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lobby
          cache-to: type=gha,mode=max,scope=lobby
      - name: Check hardened container health
        run: |
          trap 'docker rm -f lobby-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name lobby-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 0.5 \
            --health-interval 1s --health-start-period 2s --health-timeout 3s \
            --env ZEFF_LOBBY_ACCESS_TOKEN=ci-only-health-token-at-least-32-characters \
            zeff-boy-lobby:ci
          for _attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' lobby-ci)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs lobby-ci
          echo "::error::Lobby container health check failed."
          exit 1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lobby-v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lobby-v')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            docker push "$image"
          done <<< "$IMAGE_TAGS"
