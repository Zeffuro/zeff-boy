manifest_version = 1

[suite]
id = "gb-mooneye-extra"
name = "GB Mooneye expanded acceptance batch"
core = "gb"
upstream_url = "https://github.com/Gekkio/mooneye-test-suite"
license = "MIT"

[[test_groups]]
id_prefix = "gb/mooneye"
cache_prefix = "rom-tests/cache/gb"
core = "gb"
tier = "accuracy"
model = "dmg"
max_frames = 7200
tags = ["gb", "mooneye", "acceptance"]
notes = "Generic Mooneye acceptance tests using the LD B,B/Fibonacci pass convention. Boot-ROM, SGB, and suffix-specific hardware variants are intentionally separate future work."

[test_groups.artifact]
kind = "test_rom"
license = "MIT"
