manifest_version = 1

[suite]
id = "ws-asiekierka-local"
name = "WonderSwan asiekierka ws-test-suite local builds"
core = "ws"
upstream_url = "https://github.com/asiekierka/ws-test-suite"
license = "MIT"

[[test_groups]]
id_prefix = "ws/asiekierka"
cache_prefix = "rom-tests/cache/ws/asiekierka/ws-test-suite"
core = "ws"
tier = "local"
max_frames = 1800
no_apu = true
tags = ["ws", "asiekierka", "ws-test-suite", "pass-fail-tiles", "local-only"]
notes = "Source-only MIT suite. Build locally with Wonderful Toolchain, then copy upstream build/roms/* into rom-tests/cache/ws/asiekierka/ws-test-suite/."

[test_groups.artifact]
kind = "test_rom"
license = "MIT"
license_confidence = "verified"
redistributable = false
source_url = "https://github.com/asiekierka/ws-test-suite"
source_version = "7dfa0e2e869d08386b685d6a56df0bcfaf181b47 source archive; TARGET=wswan/small build outputs"
source_id = "asiekierka-ws-test-suite-7dfa0e2e"

[test_groups.pass]
kind = "ws_pass_fail_tiles"

[[test_groups.roms]]
