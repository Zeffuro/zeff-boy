legacy_paths = ["test-roms/nes-test-roms/cpu_interrupts_v2/rom_singles/2-nmi_and_brk.nes"]
expectation = { kind = "known_fail", reason = "Current NES core fails blargg cpu_interrupts_v2/2-nmi_and_brk with status=01." }

