manifest_version = 1

[suite]
id = "nes-local-accuracy"
name = "NES local accuracy tests"
core = "nes"
upstream_url = "https://www.nesdev.org/wiki/Emulator_tests"
license = "mixed/unknown; see per-test artifact metadata"

[[test_groups]]
id_prefix = "nes/blargg/cpu_interrupts_v2/rom_singles"
cache_prefix = "rom-tests/cache/nes"
core = "nes"
tier = "local"
max_frames = 18000
tags = ["nes", "blargg", "cpu", "interrupts"]
notes = "Local-only interrupt timing tests. Known-fail entries document current NES interrupt/DMA timing gaps."

[test_groups.artifact]
kind = "test_rom"
license = "unknown"
license_confidence = "unknown"
redistributable = false
source_url = "https://www.nesdev.org/wiki/Emulator_tests"
source_version = "local-cache-pending"

[test_groups.pass]
kind = "nes_6000_status"

[test_groups.expectation]
kind = "pass"

[[test_groups.roms]]
id = "2-nmi_and_brk"
archive_path = "nes-test-roms/cpu_interrupts_v2/rom_singles/2-nmi_and_brk.nes"
