manifest_version = 1

[suite]
id = "gba-public-suite-placeholders"
name = "GBA public test suite placeholders"
core = "gba"
upstream_url = "https://github.com/jsmolka/gba-tests"
license = "MIT"

[[tests]]
id = "gba/jsmolka/arm"
core = "gba"
tier = "accuracy"
max_frames = 18000
tags = ["gba", "jsmolka", "cpu", "arm"]
notes = "jsmolka renders either 'All tests passed' or 'Failed test NNN' in mode 4; headless GBA decodes that screen convention."

[tests.artifact]
kind = "test_rom"
license = "MIT"
license_confidence = "verified"
redistributable = false
source_url = "https://github.com/jsmolka/gba-tests"
