source_id = "jsmolka-gba-tests-arm-a7113b67"

[tests.rom]
path = "rom-tests/cache/gba/jsmolka/arm.gba"
sha256 = "77ee88662552bdc885c1080c0172ff119d54db791bd73b21808cf1ff1fe5b40e"

[tests.pass]
kind = "gba_screen_text"
contains = "All tests passed"

[tests.expectation]
kind = "pass"

