manifest_version = 1

[suite]
id = "nes-local-accuracy"
name = "NES local accuracy tests"
core = "nes"
upstream_url = "https://www.nesdev.org/wiki/Emulator_tests"
license = "mixed/unknown; see per-test artifact metadata"

[[test_groups]]
id_prefix = "nes/blargg/instr_test_v5/rom_singles"
cache_prefix = "rom-tests/cache/nes"
core = "nes"
tier = "local"
max_frames = 18000
tags = ["nes", "blargg", "cpu", "instructions"]
notes = "Local-only blargg CPU instruction singles. Useful for regression tracking; source-backed fetch is available, but this stays out of default CI until collection licensing is verified."

[test_groups.artifact]
kind = "test_rom"
license = "unknown"
