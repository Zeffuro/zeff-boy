<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">

<h1>Connection test</h1>
<label>Lobby URL<input id="url" value="ws://127.0.0.1:18767/v1/ws"></label>

<button id="connect">Connect</button> <button id="stop">Disconnect</button>
<pre id="status">Tests two direct data channels. No game is loaded.</pre>
<script type="module" src="probe.mjs"></script>
