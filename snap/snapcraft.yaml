name: zeff-boy
title: Zeff Boy
adopt-info: zeff-boy
summary: Multi-system emulator for classic consoles and handhelds
description: |
  Zeff Boy emulates Game Boy, Game Boy Color, Game Boy Advance, NES,
  WonderSwan, and Sega 8-bit systems. It includes save states, cheats,
  debugging tools, link support, and configurable video and audio output.
license: MIT OR Apache-2.0
website: https://github.com/Zeffuro/zeff-boy
source-code: https://github.com/Zeffuro/zeff-boy
issues: https://github.com/Zeffuro/zeff-boy/issues
base: core24
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

layout:
  /usr/share/X11/xkb:
    bind: $SNAP/usr/share/X11/xkb

apps:
  zeff-boy:
    command: bin/zeff-boy
    common-id: com.github.zeffuro.zeff-boy
    desktop: usr/share/applications/zeff-boy.desktop
    extensions: [gpu]
    plugs:
      - audio-playback
      - camera
      - desktop
      - desktop-legacy
      - home
      - joystick
      - network
      - network-bind
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  zeff-boy:
    plugin: dump
    source: snap/local/payload
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/snap/local/version")"
    organize:
      zeff-boy: bin/zeff-boy
      zeff-boy.desktop: usr/share/applications/zeff-boy.desktop
      zeff-boy.png: usr/share/icons/hicolor/512x512/apps/zeff-boy.png
      LICENSE-MIT: usr/share/doc/zeff-boy/LICENSE-MIT
      LICENSE-APACHE: usr/share/doc/zeff-boy/LICENSE-APACHE
    stage-packages:
      - libasound2t64
      - libdbus-1-3
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - xkb-data
